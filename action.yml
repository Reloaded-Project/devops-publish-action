name: 'Reloaded Publish Action'
description: 'Publish artifacts from other GitHub Actions'
author: 'Reloaded Project'
branding:
  icon: 'package'
  color: 'red'

inputs:
  # ====================
  # General Parameters
  # ====================
  artifacts-directory:
    description: 'Path to the directory containing the uncompressed artifacts'
    required: false
    default: 'artifacts'
  compressed-artifacts-directory:
    description: 'Path to the directory containing the compressed artifacts'
    required: false
    default: 'compressed-artifacts'
  create-release:
    description: 'Whether the artifacts should by uploaded to GitHub releases.'
    required: false
    default: 'true'
  checkout-current-repo:
    description: 'Checks out the current repository.'
    required: false
    default: 'true'

  # ====================
  # Compression Parameters
  # ====================
  artifact-groups-file:
    description: 'Path to YAML file containing artifact grouping configuration'
    required: false
    default: '.github/artifact-groups.yml'
  compression-tool:
    description: 'Compression tool to use (zip, 7z)'
    required: false
    default: 'zip'
  compression-args:
    description: 'Additional arguments for the compression tool'
    required: false
    default: ''

  # ====================
  # C#/NuGet Parameters
  # ====================
  csharp-nuget-api-key:
    description: 'NuGet API key for publishing packages'
    required: false
  csharp-nuget-publish-params:
    description: 'Additional parameters for dotnet nuget push'
    required: false
    default: ''

  # ====================
  # Rust/Cargo Parameters
  # ====================
  rust-crates-io-token:
    description: 'Crates.io token for publishing Rust packages'
    required: false
  rust-cargo-project-paths:
    description: 'List of paths to Rust projects (standalone projects)'
    required: false
    default: ''
  rust-cargo-workspace-root:
    description: 'Root path of the Cargo workspace'
    required: false
    default: '.'
  rust-cargo-workspace-crates:
    description: 'List of specific crates to publish from a Cargo workspace (crate names, not paths)'
    required: false
    default: ''
  rust-cargo-publish-params:
    description: 'Additional parameters for cargo publish (e.g., --dry-run)'
    required: false
    default: ''

  # ====================
  # Changelog Parameters
  # ====================
  changelog-enabled:
    description: 'Enable changelog generation'
    required: false
    default: 'false'
  changelog-include-in-release:
    description: 'Include changelog file in release assets'
    required: false
    default: 'false'
  changelog-upload-artifact:
    description: 'Upload changelog as GitHub artifact'
    required: false
    default: 'false'
  changelog-artifact-name:
    description: 'Name for the changelog artifact'
    required: false
    default: 'Changelog'
  changelog-output:
    description: 'Output file path'
    required: false
    default: 'CHANGELOG.md'
  changelog-config:
    description: 'Path to auto-changelog config file'
    required: false
    default: ''
  changelog-template:
    description: 'Template to use [compact, keepachangelog, json]'
    required: false
    default: 'compact'
  changelog-remote:
    description: 'Git remote for links'
    required: false
    default: ''
  changelog-package:
    description: 'Use version from file as latest release'
    required: false
    default: ''
  changelog-latest-version:
    description: 'Use specified version as latest release'
    required: false
    default: ''
  changelog-unreleased:
    description: 'Include unreleased changes section'
    required: false
    default: 'false'
  changelog-commit-limit:
    description: 'Number of commits to display per release'
    required: false
    default: ''
  changelog-backfill-limit:
    description: 'Number of commits to backfill empty releases'
    required: false
    default: ''
  changelog-commit-url:
    description: 'Override commit URL, use {id} for commit id'
    required: false
    default: ''
  changelog-issue-url:
    description: 'Override issue URL, use {id} for issue id'
    required: false
    default: ''
  changelog-merge-url:
    description: 'Override merge URL, use {id} for merge id'
    required: false
    default: ''
  changelog-compare-url:
    description: 'Override compare URL, use {from} and {to} for tags'
    required: false
    default: ''
  changelog-issue-pattern:
    description: 'Override regex pattern for issues in commit messages'
    required: false
    default: ''
  changelog-breaking-pattern:
    description: 'Regex pattern for breaking change commits'
    required: false
    default: ''
  changelog-merge-pattern:
    description: 'Add custom regex pattern for merge commits'
    required: false
    default: ''
  changelog-commit-pattern:
    description: 'Pattern to include when parsing commits'
    required: false
    default: ''
  changelog-ignore-commit-pattern:
    description: 'Pattern to ignore when parsing commits'
    required: false
    default: ''
  changelog-tag-pattern:
    description: 'Override regex pattern for version tags'
    required: false
    default: ''
  changelog-tag-prefix:
    description: 'Prefix used in version tags'
    required: false
    default: ''
  changelog-starting-version:
    description: 'Specify earliest version to include in changelog'
    required: false
    default: ''
  changelog-starting-date:
    description: 'Specify earliest date to include in changelog'
    required: false
    default: ''
  changelog-ending-version:
    description: 'Specify latest version to include in changelog'
    required: false
    default: ''
  changelog-sort-commits:
    description: 'Sort commits by property [relevance, date, date-desc, subject, subject-desc]'
    required: false
    default: 'relevance'
  changelog-release-summary:
    description: 'Display tagged commit message body as release summary'
    required: false
    default: 'false'
  changelog-unreleased-only:
    description: 'Only output unreleased changes'
    required: false
    default: 'false'
  changelog-hide-empty-releases:
    description: 'Hide empty releases'
    required: false
    default: 'false'
  changelog-hide-credit:
    description: 'Hide auto-changelog credit'
    required: false
    default: 'false'
  changelog-handlebars-setup:
    description: 'Handlebars setup file'
    required: false
    default: ''
  changelog-append-git-log:
    description: 'String to append to git log command'
    required: false
    default: ''
  changelog-append-git-tag:
    description: 'String to append to git tag command'
    required: false
    default: ''
  changelog-prepend:
    description: 'Prepend changelog to output file'
    required: false
    default: 'false'
  changelog-stdout:
    description: 'Output changelog to stdout'
    required: false
    default: 'false'
  changelog-is-release:
    description: 'Whether this is a GitHub Release'
    required: false
    default: 'false'
  changelog-release-tag:
    description: 'Tag associated with the GitHub Release'
    required: false
    default: ''
  changelog-override-starting-version:
    description: 'Override the starting version with the release tag if this is a GitHub Release'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Checkout repository (shallow)
      if: inputs.checkout-current-repo == 'true' && inputs.changelog-enabled != 'true'
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Checkout repository (full history)
      if: inputs.checkout-current-repo == 'true' && inputs.changelog-enabled == 'true'
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Download artifacts
      uses: actions/download-artifact@v7
      with:
        path: ${{ inputs.artifacts-directory }}

    - name: Generate Changelog
      if: inputs.changelog-enabled == 'true'
      uses: Reloaded-Project/devops-changelog@v1
      with:
        auto-checkout: false
        upload-artifact: false
        upload-release: false
        output: ${{ inputs.changelog-output }}
        config: ${{ inputs.changelog-config }}
        template: ${{ inputs.changelog-template }}
        remote: ${{ inputs.changelog-remote }}
        package: ${{ inputs.changelog-package }}
        latest-version: ${{ inputs.changelog-latest-version }}
        unreleased: ${{ inputs.changelog-unreleased }}
        commit-limit: ${{ inputs.changelog-commit-limit }}
        backfill-limit: ${{ inputs.changelog-backfill-limit }}
        commit-url: ${{ inputs.changelog-commit-url }}
        issue-url: ${{ inputs.changelog-issue-url }}
        merge-url: ${{ inputs.changelog-merge-url }}
        compare-url: ${{ inputs.changelog-compare-url }}
        issue-pattern: ${{ inputs.changelog-issue-pattern }}
        breaking-pattern: ${{ inputs.changelog-breaking-pattern }}
        merge-pattern: ${{ inputs.changelog-merge-pattern }}
        commit-pattern: ${{ inputs.changelog-commit-pattern }}
        ignore-commit-pattern: ${{ inputs.changelog-ignore-commit-pattern }}
        tag-pattern: ${{ inputs.changelog-tag-pattern }}
        tag-prefix: ${{ inputs.changelog-tag-prefix }}
        starting-version: ${{ inputs.changelog-starting-version }}
        starting-date: ${{ inputs.changelog-starting-date }}
        ending-version: ${{ inputs.changelog-ending-version }}
        sort-commits: ${{ inputs.changelog-sort-commits }}
        release-summary: ${{ inputs.changelog-release-summary }}
        unreleased-only: ${{ inputs.changelog-unreleased-only }}
        hide-empty-releases: ${{ inputs.changelog-hide-empty-releases }}
        hide-credit: ${{ inputs.changelog-hide-credit }}
        handlebars-setup: ${{ inputs.changelog-handlebars-setup }}
        append-git-log: ${{ inputs.changelog-append-git-log }}
        append-git-tag: ${{ inputs.changelog-append-git-tag }}
        prepend: ${{ inputs.changelog-prepend }}
        stdout: ${{ inputs.changelog-stdout }}
        is-release: ${{ inputs.changelog-is-release }}
        release-tag: ${{ inputs.changelog-release-tag }}
        override-starting-version: ${{ inputs.changelog-override-starting-version }}

    - name: Upload Changelog Artifact
      if: inputs.changelog-enabled == 'true' && inputs.changelog-upload-artifact == 'true'
      uses: actions/upload-artifact@v5
      with:
        name: ${{ inputs.changelog-artifact-name }}
        path: ${{ inputs.changelog-output }}

    - name: Install Python dependencies
      if: inputs.artifact-groups-file != ''
      shell: bash
      run: python3 -m pip install -r "${{ github.action_path }}/scripts/requirements.txt"

    - name: Compress artifacts
      shell: bash
      run: |
        python3 "${{ github.action_path }}/scripts/compress-artifacts.py" \
          --artifacts-dir "${{ inputs.artifacts-directory }}" \
          --output-dir "${{ inputs.compressed-artifacts-directory }}" \
          --tool "${{ inputs.compression-tool }}" \
          --args "${{ inputs.compression-args }}" \
          --groups "@${{ inputs.artifact-groups-file }}"

    - name: Create GitHub release
      if: inputs.create-release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        body_path: ${{ inputs.changelog-enabled == 'true' && inputs.changelog-output || '' }}
        files: |
          ${{ inputs.compressed-artifacts-directory }}/*
          ${{ inputs.changelog-enabled == 'true' && inputs.changelog-include-in-release == 'true' && inputs.changelog-output || '' }}

    - name: Upload to NuGet
      if: inputs.csharp-nuget-api-key != ''
      shell: pwsh
      run: |
        $items = Get-ChildItem -Path "${{ inputs.artifacts-directory }}/**.nupkg" -Recurse
        Foreach ($item in $items)
        {
            Write-Host "Pushing $item"
            dotnet nuget push "$item" -k "${{ inputs.csharp-nuget-api-key }}" -s "https://api.nuget.org/v3/index.json" --skip-duplicate ${{ inputs.csharp-nuget-publish-params }}
        }

        $items = Get-ChildItem -Path "${{ inputs.artifacts-directory }}/**.snupkg" -Recurse
        Foreach ($item in $items)
        {
            Write-Host "Pushing Symbol Package $item"
            dotnet nuget push "$item" -k "${{ inputs.csharp-nuget-api-key }}" -s "https://api.nuget.org/v3/index.json" --skip-duplicate ${{ inputs.csharp-nuget-publish-params }}
        }

    - name: Publish standalone Rust projects to crates.io
      if: inputs.rust-crates-io-token != '' && inputs.rust-cargo-project-paths != ''
      shell: bash
      run: |
        # Trim whitespace and handle empty lines
        echo "${{ inputs.rust-cargo-project-paths }}" | while read -r path || [[ -n "$path" ]]; do
          # Skip empty lines
          if [[ -z "$path" ]]; then
            continue
          fi
          
          # Trim whitespace
          path=$(echo "$path" | xargs)
          
          echo "Publishing standalone Rust package at path: $path"
          output=$(cargo publish --token "${{ inputs.rust-crates-io-token }}" --manifest-path "$path/Cargo.toml" ${{ inputs.rust-cargo-publish-params }} 2>&1) || {
            if echo "$output" | grep -q "already exists"; then
              echo "Crate version already exists, skipping..."
            else
              echo "$output"
              exit 1
            fi
          }
        done

    - name: Publish Cargo workspace crates to crates.io
      if: inputs.rust-crates-io-token != '' && inputs.rust-cargo-workspace-crates != ''
      shell: bash
      run: |
        # Trim whitespace and handle empty lines
        echo "${{ inputs.rust-cargo-workspace-crates }}" | while read -r crate || [[ -n "$crate" ]]; do
          # Skip empty lines
          if [[ -z "$crate" ]]; then
            continue
          fi
          
          # Trim whitespace
          crate=$(echo "$crate" | xargs)
          
          echo "Publishing workspace crate: $crate"
          output=$(cargo publish --token "${{ inputs.rust-crates-io-token }}" --manifest-path "${{ inputs.rust-cargo-workspace-root }}/Cargo.toml" -p "$crate" ${{ inputs.rust-cargo-publish-params }} 2>&1) || {
            if echo "$output" | grep -q "already exists"; then
              echo "Crate version already exists, skipping..."
            else
              echo "$output"
              exit 1
            fi
          }
        done
