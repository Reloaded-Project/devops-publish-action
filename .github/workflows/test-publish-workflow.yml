name: Test Compression Script

on:
  pull_request:
    branches: [v3-master]
  push:
    branches: [v3-master]
  workflow_dispatch:

jobs:
  test_compression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Run compression test suite
        run: python scripts/run-tests.py
